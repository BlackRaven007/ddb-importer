name: Release Foundry Module

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ddb-importer-release-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type checks
        run: npm run typecheck

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- NEW: Bump Version Automatically (Example: Patch bump) ---
      - name: Bump version in package.json
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # This automatically increments the patch version (e.g., 1.0.0 -> 1.0.1)
          # Alternatively, use 'npm version minor' or 'npm version major'
          npm version patch --no-git-tag-version
          
          # Commit the updated package.json back to main
          git add package.json
          git commit -m "chore(release): bump version [skip ci]"
          git push
      # -------------------------------------------------------------

      - name: Build module
        run: npm run build

      - name: Generate release metadata
        id: release_meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate module manifest
        shell: bash
        run: |
          mkdir -p dist
          node tools/build-module-json.js > dist/module.json

      - name: Build release archive
        shell: bash
        run: |
          # 1. Create a clean staging folder
          STAGING="package_staging/ddb-importer"
          mkdir -p "$STAGING"

          # 2. Copy compiled dist contents (main.mjs, etc.) into staging/dist
          mkdir -p "$STAGING/dist"
          cp -r dist/* "$STAGING/dist/"

          # 3. Move module.json out of staging/dist/ and place it at the root of the module
          mv "$STAGING/dist/module.json" "$STAGING/module.json"

          # 4. Copy optional static directories if they exist
          for dir in icons handlebars css img lang data vendor macros; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "$STAGING/"
            fi
          done

          # 5. Copy README if present
          if [ -f "README.md" ]; then
            cp README.md "$STAGING/"
          fi

          # 6. Zip everything with the top-level 'ddb-importer' folder
          cd package_staging
          zip -r ../dist/ddb-importer.zip ddb-importer
          cd ..
          rm -rf package_staging

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_meta.outputs.tag }}
          commit: main
          name: Release ${{ steps.release_meta.outputs.tag }}
          artifacts: "dist/module.json,dist/ddb-importer.zip"
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          generateReleaseNotes: true