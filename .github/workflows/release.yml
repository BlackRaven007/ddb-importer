name: Release Foundry Module

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ddb-importer-release-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type checks
        run: npm run typecheck

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build module
        run: npm run build

      - name: Generate release metadata
        id: release_meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate module manifest
        shell: bash
        run: |
          mkdir -p dist
          node tools/build-module-json.js > dist/module.json

      - name: Build release archive
        shell: bash
        run: |
          # Create a temporary staging directory matching the module ID
          STAGING="package_staging/ddb-importer"
          mkdir -p "$STAGING"

          # Copy compiled assets into staging
          cp -r dist/* "$STAGING/"
          
          # Copy optional static directories if they exist
          for dir in icons handlebars css img lang data vendor macros; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "$STAGING/"
            fi
          done

          # Copy README if present
          if [ -f "README.md" ]; then
            cp README.md "$STAGING/"
          fi

          # Ensure module.json is at the root of the staged package
          cp dist/module.json "$STAGING/module.json"

          # Zip the top-level ddb-importer folder
          cd package_staging
          zip -r ../dist/ddb-importer.zip ddb-importer
          cd ..
          rm -rf package_staging

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_meta.outputs.tag }}
          name: Release ${{ steps.release_meta.outputs.tag }}
          artifacts: "dist/module.json,dist/ddb-importer.zip"
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          generateReleaseNotes: true